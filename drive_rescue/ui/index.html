<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive Rescue</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'><defs><linearGradient id='drt' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2317A9A1'/><stop offset='1' stop-color='%230A6560'/></linearGradient></defs><rect x='4' y='4' width='120' height='120' rx='30' fill='url(%23drt)'/><circle cx='64' cy='64' r='33' fill='none' stroke='%23FFFFFF' stroke-width='24'/><circle cx='64' cy='64' r='33' fill='none' stroke='%23E8A63A' stroke-width='24' stroke-dasharray='25.9 25.9' transform='rotate(22.5 64 64)'/><circle cx='64' cy='64' r='21' fill='%230A5C58'/><circle cx='64' cy='64' r='6' fill='%23FFFFFF'/><circle cx='64' cy='64' r='2.2' fill='%230A5C58'/></svg>">
<script>(function(){var t;try{t=localStorage.getItem('dr-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.dataset.theme=t})();</script>
<style>
:root{
  --bg:#F5F7FA;--surface:#FFFFFF;--line:#DDE3EA;--line2:#C5CED8;--ink:#16202C;--muted:#5B6877;
  --accent:#0B7A75;--accent-bg:#EAF6F5;--accent-line:#BFE0DD;--accent-ink:#0B4F4B;
  --warn-bg:#FFF4E0;--warn-line:#F0D49B;--warn-ink:#6B4300;--amber:#E0A030;
  --bad-bg:#FDECEA;--bad-line:#F4B8B1;--bad-ink:#9B1C14;--ok-bg:#E6F4EA;--ok-ink:#17623A;
  --neutral-bg:#EEF1F5;--neutral-ink:#4A5663;
  --surface:#FFFFFF;--off-bg:#F8F9FB;--off-line:#E6EAF0;--dis-bg:#C9D3DC;--dis-ink:#3F4B58;--dis-quiet:#8A96A3;
  --dot:#9AA7B5;--focus:var(--focus);--on-accent:#FFFFFF;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0F161D;--surface:#17212B;--line:#2A3744;--line2:#3A4958;--ink:#E6EDF3;--muted:#9AA9B8;
  --accent:#3DB9B2;--accent-bg:#12302F;--accent-line:#1F5A57;--accent-ink:#9CE6E0;
  --warn-bg:#3A2D12;--warn-line:#6B5320;--warn-ink:#F2D08A;--amber:#E0A030;
  --bad-bg:#3A1A18;--bad-line:#7A332D;--bad-ink:#FFB4AA;--ok-bg:#12301F;--ok-ink:#8FE0B0;
  --neutral-bg:#212C37;--neutral-ink:#B5C2CF;
  --off-bg:#121A22;--off-line:#222E39;--dis-bg:#2A3744;--dis-ink:#8FA0B1;--dis-quiet:#5E6D7C;
  --dot:#6C7C8C;--focus:#5BC9C2;--on-accent:#06201F;color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.4 system-ui,"Segoe UI",Ubuntu,"DejaVu Sans",sans-serif}
button,input,select{font:inherit;color:inherit}
.page{min-height:100vh;display:flex;flex-direction:column}
.app{max-width:1040px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:22px 40px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.0625rem}
.logo{width:32px;height:32px;display:flex}.logo svg{width:100%;height:100%}
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at 50% 40%,#12767a 0%,#0a3f44 55%,#06272b 100%);color:#fff;transition:opacity .5s}
#splash svg{width:116px;height:116px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.35))}#splash b{font-size:2rem;letter-spacing:.2px}#splash span{opacity:.75;font-size:1rem}#splash.gone{opacity:0;pointer-events:none}
#stepLabel{font-size:0.8125rem;color:var(--muted)}
nav{display:flex;gap:10px;padding:16px 40px 0}
nav div{flex:1;display:flex;flex-direction:column;gap:8px;font-size:0.875rem;color:var(--muted);font-weight:500}
nav i{display:block;height:4px;border-radius:2px;background:var(--line)}
nav .done i,nav .now i{background:var(--accent)}
nav .now{color:var(--ink);font-weight:700}
main{flex:1;padding:20px 40px 24px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:1.75rem;line-height:1.2;font-weight:700}
.sub{margin:6px 0 0;color:var(--muted);font-size:1.0625rem}
.muted{color:var(--muted)}
.footbar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5}
footer{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px 16px;padding:14px 40px;flex-wrap:wrap}
.note svg{flex:none}
.tools{display:flex;align-items:center;gap:6px}
.tbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:700;cursor:pointer}
.tbtn.pw{width:auto;padding:0 12px;font-size:.875rem;font-weight:600}
.tbtn[hidden]{display:none}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
html{font-size:calc(16px * var(--zoom,1))}
footer .grp{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.note{display:flex;align-items:center;gap:8px;font-size:0.875rem;color:var(--muted)}
.btn{min-height:48px;padding:0 24px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);padding:0 28px}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn[disabled]{background:var(--dis-bg);border-color:var(--dis-bg);color:var(--dis-ink);cursor:not-allowed}
.btn.quiet[disabled]{background:transparent;border-color:transparent;color:var(--dis-quiet)}
.btn:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,.link:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.cols{display:flex;gap:14px;align-items:flex-start}
.cols>.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.eyebrow{display:flex;align-items:baseline;gap:8px}
.eyebrow b{font-size:0.75rem;letter-spacing:.08em;color:var(--accent)}
.eyebrow span{font-size:1.0625rem;font-weight:700}
.arrow{margin-top:50px;flex:none;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--accent);display:flex;align-items:center;justify-content:center}
.drive{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer}
.drive.on{border-color:var(--accent);background:var(--accent-bg)}
.drive.off{background:var(--off-bg);border-color:var(--off-line);cursor:not-allowed}
.drive input{width:22px;height:22px;margin:0;accent-color:var(--accent)}
.ico{display:flex;color:var(--muted)}
.drive.on .ico{color:var(--accent)}
.txt{flex:1;min-width:0;display:flex;flex-direction:column}
.txt b{font-size:0.9375rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txt small{font-size:0.875rem;color:var(--muted)}
.drive.off .txt b{color:var(--neutral-ink)}
.tag{font-size:0.75rem;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.tag.bad,.tag.failing{background:var(--bad-bg);color:var(--bad-ink)}
.tag.ok,.tag.healthy{background:var(--ok-bg);color:var(--ok-ink)}
.tag.warn,.tag.warning{background:var(--warn-bg);color:var(--warn-ink)}
.tag.neutral,.tag.unknown{background:var(--neutral-bg);color:var(--neutral-ink)}
.banner{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:12px;font-size:0.9375rem;font-weight:500;line-height:1.4;background:var(--accent-bg);border:1px solid var(--accent-line);color:var(--accent-ink)}
.banner svg{flex:none;margin-top:1px}
.banner.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.banner.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad-ink)}
.banner.plain{background:var(--surface);border-color:var(--line);color:var(--muted)}
.banner ul{margin:0;padding-left:18px}
details.adv{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.adv summary{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 18px;font-weight:600;cursor:pointer;list-style:none}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary small{font-weight:400;color:var(--muted)}
details.adv[open] summary svg{transform:rotate(90deg)}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:4px 18px 18px}
.fields label{display:flex;flex-direction:column;gap:6px;font-size:0.8125rem;font-weight:600}
.fields input,.fields select{height:48px;border-radius:10px;border:1px solid var(--line2);padding:0 12px;background:var(--surface);font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.card h2{margin:0 0 8px;font-size:0.9375rem;font-weight:700}
.stats{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.big{font-size:3.5rem;line-height:1;font-weight:700;color:var(--accent)}
.big small{font-size:1rem;font-weight:400;color:var(--muted);margin-left:10px}
.kv{display:flex;gap:40px;flex-wrap:wrap}
.kv span{display:block;font-size:0.8125rem;color:var(--muted)}
.kv b{font-size:1.25rem}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:16px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .6s}
.legend{display:flex;gap:16px;font-size:0.875rem;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:block}
.map{display:grid;grid-template-columns:repeat(42,minmax(0,1fr));gap:3px;margin-top:12px}
.cell{height:14px;border-radius:2px;background:var(--line)}
.cell.done{background:var(--accent)}
.cell.skipped{background:var(--amber)}
.split{display:flex;gap:16px;align-items:stretch}
.split>.card:first-child{flex:1.7;min-width:0}
.split>.card:last-child{flex:1;min-width:0}
.phase{display:flex;gap:12px;padding:7px 0}
.dot{flex:none;width:12px;height:12px;margin-top:4px;border-radius:50%;border:2px solid var(--dot);background:var(--surface)}
.phase.active .dot,.phase.done .dot{background:var(--accent);border-color:var(--accent)}
.phase b{font-size:0.875rem}
.phase small{display:block;font-size:0.875rem;color:var(--muted)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.three .card b{display:block;margin-bottom:4px}
.three .card p{margin:0;color:var(--muted);font-size:0.875rem}
.num{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--accent-bg);color:var(--accent);align-items:center;justify-content:center;font-weight:700;margin-bottom:10px}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:0.875rem;color:var(--muted)}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-align:left}
.entry{display:flex;align-items:center;gap:12px;min-height:48px;padding:4px 14px;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry input{width:22px;height:22px;accent-color:var(--accent)}
.entry .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry small{color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;max-height:340px;overflow:auto}
.mono{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;font-size:0.875rem;word-break:break-all}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.choice{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:22px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.choice:hover{border-color:var(--accent);background:var(--accent-bg)}
.choice:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.choice b{font-size:1.1875rem}.choice p{margin:0;color:var(--muted);font-size:0.9375rem;flex:1}
.choice .num{width:44px;height:44px;border-radius:12px}
.choice .go{color:var(--accent);font-weight:600;display:flex;align-items:center;gap:8px;margin-top:6px}
.confirm{display:flex;flex-direction:column;gap:6px;font-size:0.875rem;font-weight:600;max-width:320px}
.confirm input{height:48px;border-radius:10px;border:1.5px solid var(--bad-line);padding:0 14px;background:var(--surface);font-size:1rem;letter-spacing:.08em}
@media (max-width:760px){
  .two{grid-template-columns:1fr}
  header,nav,main,footer{padding-left:20px;padding-right:20px}
  footer .grp{width:100%}footer .grp .btn{flex:1;justify-content:center}
  nav div{font-size:0}nav .now{font-size:0.8125rem}
  .cols,.split{flex-direction:column}.arrow{display:none}.three{grid-template-columns:1fr}
  .fields{grid-template-columns:1fr}.big{font-size:2.75rem}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

.fields label,.netform label{display:flex;flex-direction:column;gap:6px;font-size:0.8125rem;font-weight:600}
.netform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.netform input,.netform select{height:48px;border-radius:10px;border:1px solid var(--line2);padding:0 12px;background:var(--surface);font-weight:400}
.opt{display:flex;align-items:flex-start;gap:12px;font-size:0.9375rem;cursor:pointer}
.opt input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--accent)}
.opt small{display:block;color:var(--muted);font-weight:400}
.help{display:inline-block;vertical-align:middle;margin-left:6px;position:relative}
.help>summary{list-style:none;cursor:pointer;width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);color:var(--muted);font-size:0.75rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;background:var(--surface)}
.help>summary::-webkit-details-marker{display:none}
.help>summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.help[open]>summary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.help[open]>div{position:absolute;z-index:20;left:0;top:28px;width:max-content;max-width:min(340px,78vw);padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--accent-line);color:var(--ink);font-size:0.875rem;font-weight:400;line-height:1.4;letter-spacing:0;text-transform:none;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.pv{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.pv img{max-width:100%;max-height:320px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.pv pre{margin:0;flex:1;min-width:240px;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto;font:inherit;font-size:0.875rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.row2{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.report pre{white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto;font-size:0.8125rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0 0}
@media (max-width:760px){.netform{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><defs><linearGradient id="drs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17A9A1"/><stop offset="1" stop-color="#0A6560"/></linearGradient></defs><rect x="4" y="4" width="120" height="120" rx="30" fill="url(#drs)"/><circle cx="64" cy="64" r="33" fill="none" stroke="#FFFFFF" stroke-width="24"/><circle cx="64" cy="64" r="33" fill="none" stroke="#E8A63A" stroke-width="24" stroke-dasharray="25.9 25.9" transform="rotate(22.5 64 64)"/><circle cx="64" cy="64" r="21" fill="#0A5C58"/><circle cx="64" cy="64" r="6" fill="#FFFFFF"/><circle cx="64" cy="64" r="2.2" fill="#0A5C58"/></svg><b>Drive Rescue</b><span>Rescue your files. Clone your drive.</span></div>
<div class="page"><div class="app">
  <header>
    <div class="brand"><div class="logo" id="logo"></div><span>Drive Rescue</span></div>
    <div class="tools"><span id="stepLabel" style="margin-right:10px"></span>
      <button type="button" class="tbtn pw" data-act="reboot" hidden>Restart</button>
      <button type="button" class="tbtn pw" data-act="poweroff" hidden>Shut down</button>
      <button type="button" class="tbtn" data-act="theme" aria-label="Switch between light and dark" title="Light / dark">&#9680;</button>
      <button type="button" class="tbtn" data-act="textSmaller" aria-label="Smaller text" title="Smaller text">A−</button>
      <button type="button" class="tbtn" data-act="textBigger" aria-label="Larger text" title="Larger text">A+</button></div>
  </header>
  <nav id="steps" aria-label="Progress"></nav>
  <main id="main"></main>
  </div>
  <div class="footbar"><footer id="footer"></footer></div>
</div>

<script>
"use strict";
const TOKEN = "__TOKEN__";
const NAV = {
  rescue: [[1, "Welcome"], [2, "Choose drives"], [3, "Copy"], [4, "Recover files"], [5, "Done"]],
  clone: [[1, "Welcome"], [2, "Choose drives"], [3, "Clone"], [5, "Done"]],
};
const FAT_LIMIT = 4 * 1024 ** 3 - 1;
const svg = (d, w = 20) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = {
  disk: svg('<rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="8" cy="12" r="2"/><path d="M14 10h4M14 14h4"/>', 24),
  logo: svg('<rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="8" cy="12" r="2"/><path d="M14 10h4M14 14h4"/>', 18),
  lock: svg('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>', 18),
  check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 22),
  warn: svg('<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>', 22),
  arrow: svg('<path d="M5 12h14M13 6l6 6-6 6"/>', 20),
  chev: svg('<path d="M9 6l6 6-6 6"/>', 16),
  folder: svg('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>', 22),
  file: svg('<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>', 22),
};
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const S = {
  step: 1, mode: "rescue", confirm: "", drives: [], health: {}, source: "", dest: "", folder: "DriveRescue",
  opts: { style: "gentle", retries: 3, pause_after_quick: false }, plan: null, status: null, timer: null,
  rec: { info: null, vol: "", dir: null, sel: new Set(), task: null, error: "", loading: false, timer: null, finished: false, preview: null },
  loadError: "",
  net: null, netOpen: false, netBusy: false, netError: "", netForm: { kind: "smb", address: "", share: "", user: "" },

  sound: true, lastState: null, userPaused: false,

try { S.sound = localStorage.getItem("dr-sound") !== "0"; } catch (e) { /* fine without it */ }

// Short explanations for the terms a first-time user will not know. Shown from a small "?" button.
const TIPS = {
  image: "An image file is an exact copy of the whole failing drive, saved as one big file on the healthy drive. Your files are then recovered from that copy, so the failing drive is read as little as possible.",
  style: "Gentle reads in small pieces, so a bad spot costs less of the drive. Fast is quicker, and suits a drive that is only slightly damaged.",
  retries: "After the quick copy, the program goes back over the parts it skipped and tries again, slowly. More passes can win back more data, but take longer and put the drive under more strain.",
  priority: "A failing drive can get worse the longer it runs. With this on, the copy pauses once everything that reads easily is safe, so you can get your most important files out before the slow, harder part begins.",
  skipped: "Areas that are hard to read are skipped on the first pass, so the easy data is saved first. The program comes back to them later.",
  map: "Each square is a slice of the drive. Green is copied, amber was skipped for now, and grey has not been reached yet.",

async function viewRecover() {

// ----------------------------------------------------------------- step 5
const reportCard = `<div class="card report"><div class="row2"><div><h2 style="margin:0">Report</h2><span class="muted">A plain summary of what happened, to keep or to show a technician or an insurer.</span></div>${btn("report", "Save report")}</div><div id="reportBox"></div></div>`;

// ----------------------------------------------------------------- events
document.addEventListener("click", async ev => {
  if (document.title !== "Drive Rescue") document.title = "Drive Rescue";
  const el = ev.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const act = el.dataset.act, rel = el.dataset.rel;
  try {
    if (act === "poweroff" || act === "reboot") {
      if (confirm(act === "poweroff" ? "Shut down the computer? Make sure no copy is running." : "Restart the computer? Make sure no copy is running.")) {
        await api("system/power", { action: act });
        document.body.innerHTML = '<p style="font:1.25rem system-ui;padding:3rem;text-align:center">' + (act === "poweroff" ? "Shutting down… you can unplug the drives when the screen goes dark." : "Restarting…") + "</p>";
      }
    }
    else if (act === "theme") toggleTheme();
    else if (act === "report") { el.disabled = true; try { await saveReport(); } finally { el.disabled = false; } }
    else if (act === "cancelShutdown") cancelShutdown();
    else if (act === "netOpen") { S.netOpen = true; S.netError = ""; netBoxPaint(); }
    else if (act === "netClose") { S.netOpen = false; S.netError = ""; netBoxPaint(); }
    else if (act === "netDisconnect") { await api("network/disconnect", {}); S.net = null; if (S.dest === "network") S.dest = ""; lists(); netBoxPaint(); schedulePlan(); }
    else if (act === "netConnect") {
      const f = S.netForm, pass = ($("#netPass") || {}).value || "";
      S.netBusy = true; S.netError = ""; netBoxPaint();
      try {
        const r = await api("network/connect", { kind: f.kind, address: f.address, share: f.share, user: f.user, password: pass });
        S.net = { label: r.label, free_text: r.free_text }; S.netOpen = false; S.dest = "network";
        lists(); schedulePlan();
      } catch (e) { S.netError = e.message; }
      S.netBusy = false; netBoxPaint();
    }
    else if (act === "textBigger") setZoom((S.zoom || 0) + 1);
    else if (act === "textSmaller") setZoom((S.zoom || 0) - 1);
    else if (act === "next") go(2);
    else if (act === "back") go(S.step - 1);
    else if (act === "rescan") { S.drives = []; S.health = {}; lists(); await loadDrives(); }
    else if (act === "start") {
      el.disabled = true;
      try { await api("start", { source: S.source, dest: S.dest, folder: S.folder, opts: S.opts }); S.status = null; S.lastState = null; S.userPaused = false; $("#footer").dataset.sig = ""; go(3); }
      catch (e) { S.plan = { ok: false, errors: (e.data && e.data.errors && e.data.errors.length) ? e.data.errors : [e.message], warnings: (e.data && e.data.warnings) || [] }; notice(); drivesFooter(); }
    }
    else if (act === "pause") { S.userPaused = true; S.status = await api("pause", {}); S.lastState = S.status.state; paintCopy(S.status); copyFooter(S.status); }
    else if (act === "resume") { S.userPaused = false; S.rec.preview = null; S.status = await api("resume", {}); S.lastState = S.status.state; paintCopy(S.status); copyFooter(S.status); }
    else if (act === "stop") { if (confirm(S.mode === "clone" ? "Stop cloning? The bigger drive will be left half finished and won't start up until a clone completes." : "Stop copying? What has been copied so far is kept, and you can continue later.")) { S.status = await api("stop", {}); S.lastState = S.status.state; paintCopy(S.status); copyFooter(S.status); } }
    else if (act === "toRecover") go(4);
    else if (act === "toDone") go(5);
    else if (act === "mode") { S.mode = el.dataset.mode; S.source = S.dest = ""; S.plan = null; S.confirm = ""; S.status = null; go(2); }
    else if (act === "again") { S.status = null; S.source = S.dest = ""; S.plan = null; S.confirm = ""; $("#footer").dataset.sig = ""; go(1); }
    else if (act === "startClone") {
      el.disabled = true;
      try { await api("clone/start", { source: S.source, dest: S.dest, confirm: S.confirm }); S.status = null; S.lastState = null; $("#footer").dataset.sig = ""; go(3); }
      catch (e) { S.plan = { ok: false, errors: (e.data && e.data.errors && e.data.errors.length) ? e.data.errors : [e.message], warnings: (e.data && e.data.warnings) || [] }; notice(); drivesFooter(); }
    }
    else if (act === "backCopy") { $("#footer").dataset.sig = ""; go(3); }
    else if (act === "backRecover") go(4);
    else if (act === "open") { S.rec.preview = null; await loadDir(rel); S.rec.sel = new Set(); recoverPaint(); }
    else if (act === "crumb") { S.rec.preview = null; await loadDir(rel); recoverPaint(); }
    else if (act === "preview") {
      const name = rel.split("/").pop();
      S.rec.preview = { name, rel, loading: true }; recoverPaint();
      try { S.rec.preview = { name, rel, ...(await api(`recover/preview?volume=${encodeURIComponent(S.rec.vol)}&rel=${encodeURIComponent(rel)}`)) }; }
      catch (e) { S.rec.preview = { name, rel, error: e.message }; }
      recoverPaint();
    }
    else if (act === "closePreview") { S.rec.preview = null; recoverPaint(); }
    else if (act === "pickPreview") { S.rec.sel.add(S.rec.vol + ":" + rel); S.rec.preview = null; recoverPaint(); }
    else if (act === "recoverSel") {
      const items = [...S.rec.sel].map(k => ({ volume: k.slice(0, k.indexOf(":")), rel: k.slice(k.indexOf(":") + 1) }));
      S.rec.task = await api("recover/copy", { items }); S.rec.error = ""; recoverPaint(); watchTask();
    }
    else if (act === "carve") { S.rec.task = await api("recover/carve", {}); S.rec.error = ""; recoverPaint(); watchTask(); }
    else if (act === "cancelRec") { await api("recover/cancel", {}); }
    else if (act === "finish") { await api("recover/close", {}); S.rec.finished = true; viewDone(); }
  } catch (e) {
    if (S.step === 4) { S.rec.error = e.message; recoverPaint(); } else alert(e.message);
  }
});
document.addEventListener("input", ev => {
  const id = ev.target.id;
  if (id === "confirmText") { S.confirm = ev.target.value; cloneFooter(); }
  else if (id === "netAddr") S.netForm.address = ev.target.value.trim();
  else if (id === "netShare") S.netForm.share = ev.target.value.trim();
  else if (id === "netUser") S.netForm.user = ev.target.value.trim();
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.name === "source") { S.source = t.value; const d = S.drives.find(x => x.partitions.some(p => p.path === S.dest)); if (d && d.path === S.source) S.dest = ""; lists(); schedulePlan(); }
  else if (t.name === "dest") { S.dest = t.value; lists(); schedulePlan(); }
  else if (t.id === "optPriority") { S.opts.pause_after_quick = t.checked; advHint(); schedulePlan(); }
  else if (t.id === "optSound") { S.sound = t.checked; try { localStorage.setItem("dr-sound", t.checked ? "1" : "0"); } catch (e) { /* fine */ } }
  else if (t.id === "optShut") { S.shutdownAfter = t.checked; if (!t.checked) cancelShutdown(); }
  else if (t.id === "netKind") { S.netForm.kind = t.value; S.netError = ""; netBoxPaint(); }
  else if (t.id === "optStyle") { S.opts.style = t.value; advHint(); schedulePlan(); }
  else if (t.id === "optRetries") { S.opts.retries = Math.max(0, Math.min(10, parseInt(t.value || "3", 10))); advHint(); schedulePlan(); }
  else if (t.id === "optFolder") { S.folder = t.value.trim() || "DriveRescue"; advHint(); schedulePlan(); }
  else if (t.id === "volSel") { S.rec.vol = t.value; S.rec.sel = new Set(); loadDir("").then(recoverPaint); }
  else if (t.id === "selAll") { for (const e of S.rec.dir.entries) { const k = S.rec.vol + ":" + e.rel; t.checked ? S.rec.sel.add(k) : S.rec.sel.delete(k); } recoverPaint(); }
  else if (t.dataset && t.dataset.rel !== undefined && t.type === "checkbox") { const k = S.rec.vol + ":" + t.dataset.rel; t.checked ? S.rec.sel.add(k) : S.rec.sel.delete(k); recoverPaint(); }
});

// Resume wherever the copy has got to, so reloading the page never loses your place.
setZoom(S.zoom || 0);
applyTheme();
api("system/info").then(r => { S.power = !!r.power; if (r.power) document.querySelectorAll(".pw").forEach(b => b.hidden = false); }).catch(() => {});
(async function boot() {
  const shown = Date.now();
  const hideSplash = () => { const sp = $("#splash"); if (!sp) return;
    setTimeout(() => { sp.classList.add("gone"); setTimeout(() => sp.remove(), 600); }, Math.max(0, 1100 - (Date.now() - shown))); };
  try {
    const s = await api("status");
    if (s.state !== "none") { S.mode = s.mode === "clone" ? "clone" : "rescue"; S.status = s; S.lastState = s.state; go(3); hideSplash(); return; }
  } catch (e) { /* fall through to the welcome screen */ }
  go(1);
  hideSplash();
})();
</script>
</body>
</html>
