name: Build Drive Rescue ISO

on:
  workflow_dispatch:
    inputs:
      systemrescue_version:
        description: "SystemRescue version to build on"
        default: "13.02"
  push:
    branches:
      - "fix/**"
    paths:
      - ".github/workflows/build-iso.yml"
      - "iso/**"
      - "usb/**"
      - "drive_rescue/**"
      - "tests/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Run the tests
        run: python3 -m unittest discover -s tests

      - name: Install the tools
        run: sudo apt-get update && sudo apt-get install -y xorriso squashfs-tools

      - name: Download SystemRescue and check it
        env:
          V: ${{ inputs.systemrescue_version || '13.02' }}
        run: |
          set -e
          curl -fL --retry 3 -o base.iso "https://fastly-cdn.system-rescue.org/releases/$V/systemrescue-$V-amd64.iso"
          curl -fL --retry 3 -o base.iso.sha256 "https://www.system-rescue.org/releases/$V/systemrescue-$V-amd64.iso.sha256"
          echo "$(awk '{print $1}' base.iso.sha256)  base.iso" | sha256sum -c -

      - name: Build the ISO
        run: sudo bash iso/build-iso.sh base.iso DriveRescue.iso

      - uses: actions/upload-artifact@v4
        with:
          name: DriveRescue-iso
          path: |
            DriveRescue.iso
            DriveRescue.iso.sha256
          retention-days: 14
          compression-level: 0
