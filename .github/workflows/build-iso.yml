name: Build Drive Rescue ISO

on:
  workflow_dispatch:
    inputs:
      systemrescue_version:
        description: "SystemRescue version to build on"
        default: "13.02"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Run the tests
        shell: bash
        run: |
          set +e
          python3 -m unittest discover -s tests > test.log 2>&1
          rc=$?
          cat test.log
          if [ $rc -ne 0 ]; then
            # Put the failures where they show on the run page, not only in the long log.
            {
              echo "$(python3 --version) on $(uname -sr), user $(id -un)"
              grep -v -e ResourceWarning -e 'open(' -e tracemalloc test.log | tail -70
            } | python3 -c "import sys; t=sys.stdin.read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'); print('::error title=Tests failed::'+t)"
          fi
          exit $rc

      - name: Install the tools
        run: sudo apt-get update && sudo apt-get install -y xorriso squashfs-tools

      - name: Download SystemRescue and check it
        env:
          V: ${{ inputs.systemrescue_version }}
        run: |
          set -e
          curl -fL --retry 3 -o base.iso "https://fastly-cdn.system-rescue.org/releases/$V/systemrescue-$V-amd64.iso"
          curl -fL --retry 3 -o base.iso.sha256 "https://www.system-rescue.org/releases/$V/systemrescue-$V-amd64.iso.sha256"
          echo "$(awk '{print $1}' base.iso.sha256)  base.iso" | sha256sum -c -

      - name: Build the ISO
        run: sudo bash iso/build-iso.sh base.iso DriveRescue.iso

      - uses: actions/upload-artifact@v4
        with:
          name: DriveRescue-iso
          path: |
            DriveRescue.iso
            DriveRescue.iso.sha256
          retention-days: 14
          compression-level: 0
