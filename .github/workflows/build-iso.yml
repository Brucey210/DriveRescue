name: Build Drive Rescue ISO

on:
  workflow_dispatch:
    inputs:
      systemrescue_version:
        description: "SystemRescue version to build on"
        default: "13.02"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Run the tests
        shell: bash
        run: |
          set +e
          python3 -m unittest discover -s tests > test.log 2>&1
          rc=$?
          cat test.log
          if [ $rc -ne 0 ]; then
            # Put the failures where they show on the run page, not only in the long log.
            {
              echo "$(python3 --version) on $(uname -sr), user $(id -un)"
              grep -v -e ResourceWarning -e 'open(' -e tracemalloc test.log | tail -70
            } | python3 -c "import sys; t=sys.stdin.read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'); print('::error title=Tests failed::'+t)"
          fi
          exit $rc

      - name: Install the tools
        run: sudo apt-get update && sudo apt-get install -y xorriso squashfs-tools

      - name: Download SystemRescue and check it
        env:
          V: ${{ inputs.systemrescue_version }}
        run: |
          set -e
          curl -fL --retry 3 -o base.iso "https://fastly-cdn.system-rescue.org/releases/$V/systemrescue-$V-amd64.iso"
          curl -fL --retry 3 -o base.iso.sha256 "https://www.system-rescue.org/releases/$V/systemrescue-$V-amd64.iso.sha256"
          echo "$(awk '{print $1}' base.iso.sha256)  base.iso" | sha256sum -c -

      - name: Build the ISO
        run: sudo bash iso/build-iso.sh base.iso DriveRescue.iso

      - name: Boot it in a virtual machine and look at the screen
        continue-on-error: true
        shell: bash
        run: |
          set +e
          sudo apt-get install -y qemu-system-x86 ovmf tesseract-ocr python3-pil
          mkdir -p boot-shots
          fail=0
          for mode in bios uefi; do
            python3 tests/boot_test.py DriveRescue.iso $mode boot-shots > boot-$mode.json 2> boot-$mode.err
            rc=$?
            [ $rc -ne 0 ] && fail=1
            python3 - "$mode" "$rc" <<'PY'
          import json, sys
          mode, rc = sys.argv[1], int(sys.argv[2])
          try:
              r = json.load(open(f"boot-{mode}.json"))
              last = " | ".join(f"[{x['t']}s] {x['text'][:110]}" for x in (r.get("shots") or [])[:12])
              msg = f"{mode.upper()}: {'PASSED' if rc == 0 else 'FAILED'}. Found the first screen: {r.get('found')}. Unwanted words seen: {r.get('forbidden')}. KVM: {r.get('kvm')}. Last screen text: {last} {r.get('error', '')}"
          except Exception as e:
              msg = f"{mode.upper()}: could not run the check ({e}) " + open(f"boot-{mode}.err").read()[-300:]
          print("::" + ("notice" if rc == 0 else "error") + " title=Boot test::" + msg.replace("%", "%25").replace("\n", " "))
          PY
          done
          exit $fail

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-screenshots
          path: boot-shots
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: DriveRescue-iso
          path: |
            DriveRescue.iso
            DriveRescue.iso.sha256
          retention-days: 14
          compression-level: 0
